    type: Specification
  - url: https://cassandra.apache.org/doc/latest/cassandra/cql/ddl.html
    type: Reference
  description: >-
    Cassandra Query Language (CQL) is the primary interface to Apache Cassandra. Clients speak the binary
    CQL native protocol over TCP (default port 9042). Official drivers are maintained for Java, Python,
    Go, C/C++, C#, Node.js, Ruby, and Rust.
