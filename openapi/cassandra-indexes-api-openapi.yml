openapi: 3.1.0
info:
  title: Apache Cassandra REST API (via Stargate) Columns Indexes API
  description: 'Apache Cassandra is accessed primarily via the CQL native protocol, but the

    Stargate data gateway (stargate.io) exposes a documented HTTP REST API that

    sits in front of Cassandra. This best-effort OpenAPI captures the Stargate v2

    REST endpoints for keyspace, table, column, index, type, and row management.

    Source: https://stargate.io/docs/latest/develop/dev-with-rest.html

    '
  version: 2.0.0
  contact:
    name: Apache Cassandra / Stargate
    url: https://cassandra.apache.org/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: http://{host}:8082
  description: Stargate REST API endpoint in front of a Cassandra cluster
  variables:
    host:
      default: localhost
security:
- cassandraToken: []
tags:
- name: Indexes
paths:
  /v2/schemas/keyspaces/{keyspace}/tables/{table}/indexes:
    get:
      tags:
      - Indexes
      summary: List secondary indexes on a table
      operationId: listIndexes
      parameters:
      - $ref: '#/components/parameters/Keyspace'
      - $ref: '#/components/parameters/Table'
      responses:
        '200':
          description: Index list
    post:
      tags:
      - Indexes
      summary: Create a secondary index
      operationId: createIndex
      parameters:
      - $ref: '#/components/parameters/Keyspace'
      - $ref: '#/components/parameters/Table'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                column:
                  type: string
                name:
                  type: string
                ifNotExists:
                  type: boolean
                kind:
                  type: string
                  enum:
                  - VALUES
                  - KEYS
                  - ENTRIES
                  - FULL
                type:
                  type: string
      responses:
        '201':
          description: Index created
  /v2/schemas/keyspaces/{keyspace}/tables/{table}/indexes/{index}:
    delete:
      tags:
      - Indexes
      summary: Delete a secondary index
      operationId: deleteIndex
      parameters:
      - $ref: '#/components/parameters/Keyspace'
      - $ref: '#/components/parameters/Table'
      - in: path
        name: index
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
components:
  parameters:
    Keyspace:
      in: path
      name: keyspace
      required: true
      schema:
        type: string
    Table:
      in: path
      name: table
      required: true
      schema:
        type: string
  securitySchemes:
    cassandraToken:
      type: apiKey
      in: header
      name: X-Cassandra-Token
